<!DOCTYPE html>
<html lang="ru">
<head>

    <title>Gentboom · разработчик и автоматизация</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="noise"></div>
    
    <main class="container">
        <div class="profile">
            <div class="avatar-frame">
                <div class="avatar-gradient"></div>
                <i class="fas fa-code avatar-icon"></i>
            </div>

            <div class="badge">

            <p class="bio">Python Developer · Open Source · Telegram Automation</p>
            
            <div class="stats">
                <div class="stat">
                    <span class="stat-value">4+</span>
                    <span class="stat-label">years exp</span>
                </div>
                <div class="stat">
                    <span class="stat-value">15+</span>

                <div class="stat">
                    <span class="stat-value">100%</span>

        <div class="links">
            <a href="https://github.com/Artem1233-gif" class="link-card" target="_blank" rel="noopener noreferrer">
                <div class="link-icon"><i class="fab fa-github"></i></div>
                <div class="link-info">
                    <span class="link-title">GitHub</span>
                    <span class="link-desc">Исходный код и проекты</span>
                </div>

            <a href="https://t.me/Gentboom" class="link-card" target="_blank" rel="noopener noreferrer">
                <div class="link-icon telegram"><i class="fab fa-telegram-plane"></i></div>
                <div class="link-info">
                    <span class="link-title">Telegram</span>
                    <span class="link-desc">@Gentboom — контакты</span>
                </div>
                <i class="fas fa-arrow-right"></i>
            </a>

            <a href="stars.html" class="link-card">
                <div class="link-icon stars"><i class="fas fa-star"></i></div>
                <div class="link-info">
                    <span class="link-title">Купить звёзды</span>
                    <span class="link-desc">@Tg_Stars_gent</span>
                </div>
                <i class="fas fa-arrow-right"></i>
            </a>

            <a href="donate.html" class="link-card">
                <div class="link-icon donate"><i class="fas fa-heart"></i></div>
                <div class="link-info">
                    <span class="link-title">Donate</span>
                    <span class="link-desc">Поддержать TON</span>
                </div>
                <i class="fas fa-arrow-right"></i>
            </a>

            <a href="channel.html" class="link-card">
                <div class="link-icon channel"><i class="fab fa-telegram"></i></div>
                <div class="link-info">
                    <span class="link-title">Telegram канал</span>
                    <span class="link-desc">@gentboom123</span>
                </div>
                <i class="fas fa-arrow-right"></i>
            </a>

        <footer class="footer">
            <p>Разработчик: deepseek</p>
            <div class="crypto-badge">
                <i class="fab fa-bitcoin"></i> TON · Open Source
