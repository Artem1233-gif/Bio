<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram канал — Gentboom</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .channel-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2rem;
            text-align: center;
            margin: 2rem 0;
        }
        .channel-icon {
            font-size: 4rem;
            color: #2b8cdf;
            margin-bottom: 1rem;
        }
        .channel-button {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: #2b8cdf;
            color: white;
            padding: 1rem 2rem;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 1.5rem;
            transition: transform 0.2s;
        }
        .channel-button:hover {
            background: #1f6bb9;
            transform: scale(1.02);
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent);
            text-decoration: none;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="noise"></div>
    <main class="container">
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> На главную
        </a>
        <div class="profile">
            <h1><i class="fab fa-telegram"></i> Мой Telegram канал</h1>
            <p class="bio">Новости, статьи и полезные материалы</p>
        </div>
        <div class="channel-card">
            <div class="channel-icon"><i class="fab fa-telegram-plane"></i></div>
            <h3>@gentboom123</h3>
            <p style="color: var(--text-secondary); margin-top: 0.5rem;">Подписывайтесь, чтобы быть в курсе!</p>
            <a href="https://t.me/gentboom123" class="channel-button" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-telegram"></i> Перейти в канал
            </a>
        </div>
        <footer class="footer">
            <p>Разработчик: deepseek</p>
        </footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
