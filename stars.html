<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Купить звёзды — Gentboom</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .stars-container {
            text-align: center;
            padding: 2rem 0;
        }
        .stars-icon {
            font-size: 4rem;
            color: #f59e0b;
            margin-bottom: 1rem;
        }
        .telegram-button {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: #2b8cdf;
            color: white;
            padding: 1rem 2rem;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 600;
            margin: 2rem 0;
            transition: transform 0.2s, background 0.2s;
        }
        .telegram-button:hover {
            background: #1f6bb9;
            transform: scale(1.02);
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent);
            text-decoration: none;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="noise"></div>
    <main class="container">
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> На главную
        </a>
        <div class="profile">
            <div class="stars-icon">
                <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i>
            </div>
            <h1>Покупка звёзд</h1>
            <p class="bio">Приобрести звёзды Telegram можно у официального продавца</p>
        </div>
        <div class="stars-container">
            <a href="https://t.me/Tg_Stars_gent" class="telegram-button" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-telegram-plane"></i> @Tg_Stars_gent
            </a>
            <p style="color: var(--text-secondary);">Нажмите, чтобы перейти в Telegram и оформить заказ</p>
        </div>
        <footer class="footer">
            <p>Разработчик: deepseek</p>
        </footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
